<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Log activity | iHospitality Portal</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <nav id="shell-nav"></nav>
  <div class="mobile-nav" id="shell-mobile"></div>

  <main class="portal-main">
    <div class="portal-head">
      <div>
        <span class="portal-eyebrow">My work</span>
        <h1>Log activity</h1>
        <p class="portal-sub">Log the work. Check-ins you have not logged yet wait at the top.</p>
      </div>
    </div>

    <div id="gate"></div>
    <div id="app" hidden>
      <div id="outbox"></div>
      <div id="pay"></div>

      <section class="fx-section" id="open-section" hidden>
        <h2>Accounts you were at, not logged yet</h2>
        <ul class="fx-list" id="open-list"></ul>
      </section>

      <section class="fx-section" id="form-section">
        <h2>Log an activity</h2>
        <div id="from-checkin"></div>

        <label class="fx-label">Activity name
          <input class="fx-input" id="name" placeholder="e.g. Tasting at Bella Napoli">
        </label>

        <p class="fx-label">Venue</p>
        <div id="venue"></div>

        <label class="fx-label" style="margin-top:0.9rem">Close date (when it was done)
          <input class="fx-input" type="date" id="close-date">
        </label>

        <p class="fx-label">Brands</p>
        <div id="brand-chips" class="fx-row" style="margin-bottom:0.6rem"></div>
        <select id="add-brand" class="fx-input" style="margin-bottom:0.9rem"></select>

        <div class="fx-row">
          <label class="fx-label">Activity type
            <select id="type" class="fx-input"></select>
          </label>
          <label class="fx-label" style="flex:0 1 120px">Quantity
            <input class="fx-input" type="number" min="0" step="1" id="quantity" value="1">
          </label>
        </div>
        <p class="fx-muted" id="type-msg"></p>

        <div id="brand-notes"></div>

        <p class="fx-label" style="margin-top:1.25rem">Photos</p>
        <div class="fx-row">
          <button type="button" class="fx-btn" id="take-photo">Take photo</button>
          <button type="button" class="fx-btn" id="upload-photo">Upload</button>
        </div>
        <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
        <input type="file" id="library-input" accept="image/*" multiple hidden>
        <div class="fx-photos" id="photos"></div>
        <p class="fx-muted" id="photo-msg"></p>

        <div id="form-err"></div>
        <button class="btn-full" id="save" style="margin-top:1rem">Save activity</button>
        <p class="fx-muted" id="save-msg" style="margin-top:0.6rem"></p>
      </section>
    </div>
  </main>

  <footer id="shell-footer"></footer>

  <script type="module">
    /* ONE ACTIVITY, ONE TYPE, ONE QUANTITY; EACH BRAND ONLY ADDS ITS OWN NOTES.
       Operator, 14 Sep 2026: the activity is what was done, so a shared tasting
       is one `tasting event split` for every brand at it, never a different
       type per brand. The database still stores one row per brand (so money and
       brand isolation stay per brand); this page just fills them all the same.

       NO AMOUNT FIELD. The dollar value a percentage rate is taken of comes from
       the distributor's depletion report and is filled in by the office at month
       end (D98, Review and edit), not typed in the field. */
    import { db, requireAuth, renderShell, render, esc, money } from './portal.js';
    import { newId, todayIso, errorText, getLocation, warmLocation, openCamera, preparePhotos, venuePicker,
             outboxAll, outboxPut, draftGet, draftPut, draftDelete,
             flushOutbox, keepFlushing } from './field.js';

    const auth = await requireAuth();
    if (auth) {
      renderShell('log.html', auth.profile);
      if (!auth.profile.contractor_id) {
        render(document.getElementById('gate'), { empty: {
          title: 'This login is not linked to a person in the field',
          body: 'Logging work records who did it. Ask Nicholas to link your login to your contractor record.' } });
      } else {
        start(auth);
      }
    }

    async function start(auth) {
      document.getElementById('app').hidden = false;
      warmLocation();
      const userId = auth.session.user.id;
      const mine = auth.profile.contractor_id;
      const $ = (id) => document.getElementById(id);

      const { data: brandRows } = await db.from('brands')
        .select('id, name').eq('is_active', true).order('name');
      const brands = brandRows || [];
      const brandName = (id) => brands.find(b => b.id === id)?.name || '';

      const typeCache = new Map();
      async function typesFor(brandId) {
        if (!typeCache.has(brandId)) {
          const { data, error } = await db.rpc('field_activity_types', { p_brand: brandId });
          typeCache.set(brandId, error ? [] : (data || []).map(t => t.source_activity_type));
        }
        return typeCache.get(brandId);
      }

      /* ---------- this month so far: the contractor's OWN pay ----------
         Never the charge (D137). Same sources as My pay. */
      async function drawPay() {
        const month = todayIso().slice(0, 7);
        const [{ data: earned }, { data: base }] = await Promise.all([
          db.from('v_my_activity_pay').select('earned').eq('month', month),
          db.from('v_my_pay').select('monthly_equivalent').eq('month', month),
        ]);
        const activity = (earned || []).reduce((a, r) => a + Number(r.earned || 0), 0);
        const basePay = (base || []).reduce((a, r) => a + Number(r.monthly_equivalent || 0), 0);
        $('pay').innerHTML = `<div class="fx-pay">
          <div><div class="lbl">This month so far</div>
            <div class="num">${money(activity + basePay)}</div></div>
          <div class="fx-muted">${money(activity)} from ${(earned || []).length} activities
            ${basePay ? `+ ${money(basePay)} base (monthly spread)` : ''}</div></div>`;
      }

      async function drawOutbox() {
        const items = await outboxAll();
        if (!items.length) { $('outbox').innerHTML = ''; return; }
        $('outbox').innerHTML = `<div class="fx-banner">
          <strong>${items.length} not sent yet</strong>, saved on this phone and
          sending ${navigator.onLine ? 'now' : 'when you are back online'}.
          ${items.filter(i => i.blocked).map(i => `<div style="margin-top:0.4rem">“${esc(i.name || i.venue?.name || 'Check-in')}”: ${esc(i.error || '')}</div>`).join('')}
          <div style="margin-top:0.6rem"><button class="fx-btn" id="retry">Send now</button></div></div>`;
        $('retry').onclick = async () => {
          for (const i of items) { i.blocked = false; await outboxPut(i); }
          await refresh();
        };
      }

      /* ---------- check-ins not logged yet ----------
         The contractor_id filter is SCOPE ("yours"); RLS is the lock. */
      let openCheckins = [];
      async function drawOpen() {
        const { data, error } = await db.from('venue_checkin')
          .select('id, venue_id, checked_in_at, note, venues(name, city)')
          .eq('contractor_id', mine).eq('status', 'open')
          .order('checked_in_at', { ascending: false });
        openCheckins = error ? [] : (data || []);
        $('open-section').hidden = !openCheckins.length;
        $('open-list').innerHTML = openCheckins.map(c => `<li>
            <span><strong>${esc(c.venues?.name || 'Venue')}</strong>
              <span class="when">${esc(new Date(c.checked_in_at).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</span>
              ${c.note ? `<br><span class="fx-muted">${esc(c.note)}</span>` : ''}</span>
            <span class="fx-row" style="flex:0 0 auto">
              <button class="fx-btn" data-log="${c.id}">Log it</button>
              <button class="fx-btn" data-dismiss="${c.id}">Nothing to log</button></span></li>`).join('');
        $('open-list').querySelectorAll('[data-log]').forEach(b => b.onclick = () =>
          fromCheckin(openCheckins.find(x => x.id === b.dataset.log)));
        $('open-list').querySelectorAll('[data-dismiss]').forEach(b => b.onclick = async () => {
          const reason = prompt('Why was there nothing to log? (optional)');
          if (reason === null) return;
          const { error } = await db.rpc('field_dismiss_checkin', { p_checkin: b.dataset.dismiss, p_reason: reason });
          if (error) alert(errorText(error));
          drawOpen();
        });
      }

      const refresh = async () => {
        await flushOutbox(userId);
        await Promise.all([drawOutbox(), drawOpen(), drawPay()]);
      };
      keepFlushing(userId, () => Promise.all([drawOutbox(), drawOpen(), drawPay()]));

      /* ---------- the form ---------- */
      const blank = () => ({ name: '', venue: null, close_date: todayIso(), checkin: null,
        brands: [], activity_type: '', quantity: 1, photos: [] });
      const form = blank();

      function fromCheckin(c) {
        form.checkin = { id: c.id, venue: c.venues?.name };
        form.venue = { id: c.venue_id, name: c.venues?.name, city: c.venues?.city };
        form.close_date = c.checked_in_at.slice(0, 10);
        drawForm(); saveDraft();
        $('form-section').scrollIntoView({ behavior: 'smooth' });
      }

      /* The type list is what EVERY chosen brand can be logged as: one type is
         saved on every brand's row, and the database refuses a type a brand's
         rate card does not know. */
      async function drawTypes() {
        const sel = $('type');
        if (!form.brands.length) {
          sel.innerHTML = '<option value="">Add a brand first</option>';
          sel.disabled = true; $('type-msg').textContent = ''; return;
        }
        const lists = await Promise.all(form.brands.map(b => typesFor(b.brand_id)));
        const common = lists.reduce((acc, l) => acc.filter(t => l.includes(t)));
        sel.disabled = false;
        sel.innerHTML = `<option value="">Pick the activity type</option>` + common.map(t =>
          `<option value="${esc(t)}"${t === form.activity_type ? ' selected' : ''}>${esc(t)}</option>`).join('');
        if (form.activity_type && !common.includes(form.activity_type)) form.activity_type = '';
        $('type-msg').textContent = form.brands.length > 1 && !common.length
          ? 'These brands share no activity type. Log them separately or ask the office to add one.' : '';
      }

      function drawBrands() {
        $('brand-chips').innerHTML = form.brands.map(b => `<span class="fx-chip" style="flex:0 0 auto">
          <span>${esc(brandName(b.brand_id))}</span>
          <button type="button" class="link-btn" data-remove="${b.brand_id}" aria-label="Remove">×</button></span>`).join('');
        $('brand-chips').querySelectorAll('[data-remove]').forEach(x => x.onclick = () => {
          form.brands = form.brands.filter(b => b.brand_id !== x.dataset.remove);
          drawBrands(); saveDraft();
        });
        const left = brands.filter(b => !form.brands.some(f => f.brand_id === b.id));
        $('add-brand').innerHTML = `<option value="">${form.brands.length ? '+ Add another brand' : 'Pick a brand'}</option>`
          + left.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('');

        // Notes, one pair per brand: what that brand reads, and what it never does.
        $('brand-notes').innerHTML = form.brands.map(b => `
          <div class="fx-line" data-brand="${b.brand_id}">
            <div class="fx-line-head"><span>${esc(brandName(b.brand_id))}</span></div>
            <label class="fx-label">What ${esc(brandName(b.brand_id))} sees
              <textarea class="fx-input" rows="2" data-f="summary">${esc(b.summary)}</textarea></label>
            <label class="fx-label">Internal notes (never shown to the brand)
              <textarea class="fx-input" rows="2" data-f="notes">${esc(b.notes)}</textarea></label>
          </div>`).join('');
        $('brand-notes').querySelectorAll('[data-brand]').forEach(box => {
          const b = form.brands.find(x => x.brand_id === box.dataset.brand);
          box.querySelectorAll('[data-f]').forEach(t => t.oninput = () => { b[t.dataset.f] = t.value; saveDraft(); });
        });

        drawTypes(); drawPhotos();
      }

      $('add-brand').onchange = (e) => {
        if (!e.target.value) return;
        form.brands.push({ brand_id: e.target.value, summary: '', notes: '' });
        drawBrands(); saveDraft();
      };
      $('type').onchange = (e) => { form.activity_type = e.target.value; saveDraft(); };
      $('quantity').oninput = (e) => { form.quantity = e.target.value; saveDraft(); };
      $('name').oninput = (e) => { form.name = e.target.value; saveDraft(); };
      $('close-date').oninput = (e) => { form.close_date = e.target.value; saveDraft(); };

      /* Photos: consent per photo, and with more than one brand, which brands
         may see it. Visible by default (operator ruling). */
      function drawPhotos() {
        $('photos').innerHTML = form.photos.map(p => `
          <div class="fx-photo" data-id="${p.id}">
            <img src="${p.url}" alt="">
            <button type="button" class="fx-x" aria-label="Remove photo">×</button>
            <div class="fx-photo-opts">
              <label><input type="checkbox" data-consent ${p.consent ? 'checked' : ''}> People in it agreed</label>
              ${form.brands.length > 1 ? form.brands.map(b => `<label><input type="checkbox" data-brand="${b.brand_id}"
                 ${p.hiddenFor.includes(b.brand_id) ? '' : 'checked'}> ${esc(brandName(b.brand_id))} can see</label>`).join('') : ''}
            </div></div>`).join('');
        $('photos').querySelectorAll('.fx-photo').forEach(box => {
          const p = form.photos.find(x => x.id === box.dataset.id);
          box.querySelector('.fx-x').onclick = () => { form.photos = form.photos.filter(x => x !== p); drawPhotos(); saveDraft(); };
          box.querySelector('[data-consent]').onchange = (e) => { p.consent = e.target.checked; saveDraft(); };
          box.querySelectorAll('[data-brand]').forEach(cb => cb.onchange = () => {
            p.hiddenFor = cb.checked ? p.hiddenFor.filter(x => x !== cb.dataset.brand)
                                     : [...new Set([...p.hiddenFor, cb.dataset.brand])];
            saveDraft();
          });
        });
      }

      async function addFiles(files) {
        if (!files?.length) return;
        $('photo-msg').textContent = 'Preparing photos…';
        try {
          for (const p of await preparePhotos([...files])) {
            p.url = URL.createObjectURL(p.blob); form.photos.push(p);
          }
          $('photo-msg').textContent = '';
        } catch (e) { $('photo-msg').textContent = errorText(e); }
        drawPhotos(); saveDraft();
      }
      // The in-page camera first (Android kills the browser behind the separate
      // Camera app); the phone's own camera app only if this one cannot open.
      $('take-photo').onclick = async () => {
        const opened = await openCamera((file) => addFiles([file]));
        if (!opened) $('camera-input').click();
      };
      $('upload-photo').onclick = () => $('library-input').click();
      $('camera-input').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
      $('library-input').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };

      function drawForm() {
        $('name').value = form.name;
        $('close-date').max = todayIso();
        $('close-date').value = form.close_date;
        $('quantity').value = form.quantity;
        $('from-checkin').innerHTML = form.checkin
          ? `<div class="fx-card" style="margin:0 0 0.9rem">Logging your check-in at <strong>${esc(form.checkin.venue)}</strong>.
              <button type="button" class="link-btn" id="unlink">Not from this check-in</button></div>` : '';
        if (form.checkin) $('unlink').onclick = () => { form.checkin = null; drawForm(); saveDraft(); };
        // A check-in fixes the venue: the database refuses any other.
        if (form.checkin) {
          $('venue').innerHTML = `<div class="fx-chip"><span><strong>${esc(form.venue.name)}</strong></span></div>`;
        } else {
          venuePicker($('venue'), (v) => { form.venue = v; saveDraft(); }, form.venue);
        }
        drawBrands();
      }

      /* ---------- the draft: nothing typed is lost if the page closes ---------- */
      let draftTimer = null;
      function saveDraft() {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(() => {
          const { photos, ...rest } = form;
          draftPut('log-v2', { ...rest, photos: photos.map(({ url, ...p }) => p) }).catch(() => {});
        }, 400);
      }
      const draft = await draftGet('log-v2').catch(() => null);
      if (draft?.value) {
        Object.assign(form, draft.value);
        form.photos = (form.photos || []).map(p => ({ ...p, url: URL.createObjectURL(p.blob) }));
      }
      drawForm();

      /* ---------- save ---------- */
      $('save').onclick = async () => {
        $('form-err').innerHTML = '';
        const problems = [];
        if (!form.name.trim()) problems.push('Name the activity.');
        if (!form.venue) problems.push('Pick the venue.');
        if (!form.close_date || form.close_date > todayIso()) problems.push('The close date cannot be in the future.');
        if (!form.brands.length) problems.push('Add at least one brand.');
        if (!form.activity_type) problems.push('Pick the activity type.');
        if (!(Number(form.quantity) >= 0)) problems.push('Quantity cannot be negative.');
        if (problems.length) {
          $('form-err').innerHTML = `<div class="err">${problems.map(esc).join('<br>')}</div>`;
          return;
        }

        // Someone else logged the same thing here that day? Warn, never block:
        // everyone logs their own (operator ruling).
        if (navigator.onLine && form.venue.id) {
          const { data: dupes } = await db.from('v_internal_activity')
            .select('contractor').eq('venue_id', form.venue.id)
            .eq('activity_date', form.close_date).eq('source_activity_type', form.activity_type)
            .neq('contractor_id', mine).limit(1);
          if (dupes?.length && !confirm(`${dupes[0].contractor || 'Someone'} already logged ${form.activity_type} here on this date. Save yours too?`)) return;
        }

        $('save').disabled = true;
        $('save-msg').textContent = 'Getting your location…';
        const location = await getLocation();

        await outboxPut({
          kind: 'activity', id: newId(), created: Date.now(),
          venue: form.venue, close_date: form.close_date, name: form.name.trim(),
          checkin_id: form.checkin?.id || null, location,
          // One row per brand, all the same type and quantity; notes per brand.
          lines: form.brands.map(b => ({ brand_id: b.brand_id, activity_type: form.activity_type,
            quantity: Number(form.quantity || 0), summary: b.summary, notes: b.notes })),
          photos: form.photos.map(({ url, ...p }) => p),
        });
        await draftDelete('log-v2');

        form.photos.forEach(p => URL.revokeObjectURL(p.url));
        Object.assign(form, blank());
        drawForm();

        $('save-msg').textContent = 'Sending…';
        const { failed } = await flushOutbox(userId);
        $('save').disabled = false;
        $('save-msg').textContent = failed
          ? 'Saved on this phone. It will send when it can (see above).'
          : `Saved${location.status === 'ok' ? '' : ` (no location: ${location.status})`}.`;
        await Promise.all([drawOutbox(), drawOpen(), drawPay()]);
      };

      await refresh();
    }
  </script>
</body>
</html>
