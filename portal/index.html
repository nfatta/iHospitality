<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | iHospitality Brand Portal</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <nav id="shell-nav"></nav>
  <div class="mobile-nav" id="shell-mobile"></div>

  <main class="portal-main">
    <div class="portal-head">
      <div>
        <span class="portal-eyebrow">Brand Portal</span>
        <h1 id="title">Dashboard</h1>
        <p class="portal-sub" id="range"></p>
      </div>
    </div>

    <div id="stats"></div>

    <div class="panel">
      <div class="panel-head">
        <h2>Month by month</h2>
        <span class="hint">Activity across your accounts</span>
      </div>
      <div id="months"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Recent activity</h2>
        <span class="hint"><a href="activity.html" style="color:var(--gold);text-decoration:none">View all &rarr;</a></span>
      </div>
      <div id="recent"></div>
    </div>
  </main>

  <footer id="shell-footer"></footer>

  <script type="module">
    import { db, requireAuth, renderShell, render, esc, fmtDate, fmtMonth, fmtNum,
             money, sortableTable, isContractor } from './portal.js';

    const auth = await requireAuth();
    if (auth && isContractor(auth.profile)) {
      renderShell('index.html', auth.profile);
      await contractorDashboard(auth.profile);
    } else if (auth) {
      renderShell('index.html', auth.profile);
      document.getElementById('title').textContent = auth.profile.brands?.name || 'All brands';

      // Every query below is unfiltered by brand ON PURPOSE. Row-level security
      // adds the brand restriction in Postgres, so the browser never decides
      // what this user may see — and a bug here cannot leak another brand.
      //
      // v_monthly_summary is grouped by MONTH ONLY. Because the view runs as
      // security_invoker, RLS filters the rows before the aggregate: a brand
      // user gets their own months, staff get all brands combined into one row
      // per month. That is the fix for August appearing four times.
      const [months, log, venues] = await Promise.all([
        db.from('v_monthly_summary').select('*').order('month', { ascending: false }),
        db.from('v_brand_activity_log').select('*')
          // See the note in activity.html. Filtered BEFORE the limit.
          .neq('activity_type_code', 'monthly_commission').limit(10),
        db.from('v_brand_venue_counts').select('venue_id'),
      ]);

      renderStats(months, venues);
      renderMonths(months);
      renderRecent(log);
    }

    /* ==========================================================
       THE CONTRACTOR'S WORKLIST (D137)

       "Where do I go this week?" -- built from FACTS the data already
       holds, never from GRADES. `v_venue_performance` carries the status
       with dormancy derived live, the days since anyone was in the room,
       and whether the account has ever bought. Ranking on those answers
       the question without any A/B/C/D, any cap and any campaign.

       THAT IS DELIBERATE. Venue grading and the routed week are DESIGNED
       AND NOT AGREED (D117) -- the arithmetic only works if A is capped
       as a share of capacity and a B graded on potential drops after 90
       days. Putting a grade-driven route on the dashboard would settle
       all of that by default, the first time somebody opened the page.
       The grade is shown where it exists and nothing is ranked by it.
       ========================================================== */
    async function contractorDashboard(profile) {
      document.querySelector('.portal-eyebrow').textContent = 'My work';
      document.getElementById('title').textContent = profile.contractors?.name || 'Dashboard';
      document.querySelector('.panel-head h2').textContent = 'Needs attention';
      document.querySelectorAll('.panel-head .hint')[0].textContent =
        'Your accounts, longest quiet first';
      document.querySelectorAll('.panel-head h2')[1].textContent = 'My recent work';

      const el = document.getElementById('months');

      if (!profile.contractor_id) {
        document.getElementById('range').textContent = '';
        return render(el, { empty: {
          title: 'No contractor linked',
          body: 'This login is not linked to a contractor, so it owns no accounts.' } });
      }

      const { data: mine, error: e1 } = await db.from('venue_grading')
        .select('venue_id, grade').eq('owner_contractor_id', profile.contractor_id);
      if (e1) return render(el, { error: e1 });

      // My recent work reads the SAME view the pay page does, so "what I did"
      // has one definition. It is empty for work with nobody recorded against
      // it -- blank means NOT RECORDED, never "nobody" (D135).
      const { data: recent } = await db.from('v_my_activity_pay')
        .select('*').order('activity_date', { ascending: false }).limit(10);
      renderMyRecent(recent || []);

      if (!mine.length) {
        document.getElementById('range').textContent = 'No accounts assigned to you yet';
        return render(el, { empty: {
          title: 'No accounts assigned yet',
          body: 'Venues assigned to you will appear here.' } });
      }

      const grades = Object.fromEntries(mine.map(m => [m.venue_id, m.grade]));
      const { data, error } = await db.from('v_venue_performance')
        .select('*').in('venue_id', mine.map(m => m.venue_id));
      if (error) return render(el, { error });

      // One row per venue, not per brand-venue pair. A venue is SHARED (D129),
      // so a worklist keyed per brand would send someone to the same bar eight
      // times over.
      const byVenue = new Map();
      for (const r of data) {
        const cur = byVenue.get(r.venue_id);
        if (!cur) {
          byVenue.set(r.venue_id, { ...r, grade: grades[r.venue_id] });
        } else if ((r.last_touched || '') > (cur.last_touched || '')) {
          Object.assign(cur, r, { grade: grades[r.venue_id] });
        }
      }
      const rows = [...byVenue.values()];

      // COUNTS READ `status_stored`, NOT the displayed status (D87). Dormancy
      // layers over the stored value, so counting stocking accounts off the
      // display drops every one that has gone quiet -- which is exactly the set
      // this page exists to surface.
      const counts = {};
      for (const r of rows) counts[r.status_stored] = (counts[r.status_stored] || 0) + 1;
      const stocking = (counts.placed || 0) + (counts.reordering || 0);
      const quiet = rows.filter(r => r.days_since !== null && Number(r.days_since) > 90 &&
        (r.status_stored === 'placed' || r.status_stored === 'reordering')).length;
      const never = rows.filter(r => r.days_since === null).length;

      document.getElementById('range').textContent =
        `${fmtNum(rows.length)} accounts you own`;

      const stats = document.getElementById('stats');
      stats.className = 'stat-grid';
      stats.innerHTML = `
        <div class="stat-card"><span class="num">${fmtNum(rows.length)}</span>
          <span class="lbl">My accounts</span></div>
        <div class="stat-card"><span class="num">${fmtNum(stocking)}</span>
          <span class="lbl">Stocking</span><div class="meta">placed or reordering</div></div>
        <div class="stat-card"><span class="num">${fmtNum(quiet)}</span>
          <span class="lbl">Quiet 90+ days</span><div class="meta">stocking, not seen lately</div></div>
        <div class="stat-card"><span class="num">${fmtNum(never)}</span>
          <span class="lbl">Never visited</span><div class="meta">no activity on record</div></div>`;

      // The worklist itself: quiet accounts first, then the never-visited.
      // Capped at 20 -- a dashboard is a place to start, and the whole list is
      // one click away on My accounts.
      const needing = rows
        .filter(r => r.days_since === null || Number(r.days_since) > 60)
        .sort((a, b) => {
          const av = a.days_since === null ? Infinity : Number(a.days_since);
          const bv = b.days_since === null ? Infinity : Number(b.days_since);
          return bv - av;
        })
        .slice(0, 20);

      if (!needing.length) {
        return render(el, { empty: {
          title: 'Nothing is waiting',
          body: 'Every account you own has been touched in the last two months.' } });
      }

      sortableTable(el, needing, [
        { head: 'Account', always: true, cls: 'venue', value: r => r.venue_name,
          get: r => esc(r.venue_name) },
        { head: 'City', value: r => r.city,
          get: r => r.city ? esc(r.city) : '<span class="muted">—</span>' },
        { head: 'Grade', value: r => r.grade,
          get: r => r.grade ? `<span class="pill">${esc(r.grade)}</span>`
                            : '<span class="muted">—</span>' },
        { head: 'Status', always: true, value: r => r.status,
          get: r => `<span class="pill pill-${esc(r.status)}">${esc(r.status)}</span>` },
        { head: 'Last visit', always: true, nowrap: true,
          sortValue: r => r.last_touched || '',
          get: r => r.last_touched ? esc(fmtDate(r.last_touched)) : '<span class="muted">never</span>' },
        { head: 'Quiet', always: true, cls: 'num', nowrap: true,
          sortValue: r => r.days_since === null ? Infinity : Number(r.days_since),
          get: r => {
            if (r.days_since === null) return '<span class="pill pill-lost">never</span>';
            const d = Number(r.days_since);
            const cls = d > 180 ? 'pill pill-lost' : d > 90 ? 'pill pill-dormant' : 'muted';
            return `<span class="${cls}">${fmtNum(d)}d</span>`;
          } },
      ], {
        sort: 'Quiet', dir: 'desc',
        onRowClick: r => { location.href = `venue.html?id=${encodeURIComponent(r.venue_id)}`; },
      });
    }

    function renderMyRecent(rows) {
      const el = document.getElementById('recent');
      if (!rows.length) {
        return render(el, { empty: {
          title: 'No work recorded against you yet',
          body: 'Activities recorded as yours will appear here.' } });
      }
      el.innerHTML = `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Date</th><th>Account</th><th>Brand</th><th>What</th>
          <th class="num">Earned</th></tr></thead>
        <tbody>${rows.map(r => `<tr>
          <td class="nowrap">${esc(fmtDate(r.activity_date))}</td>
          <td class="venue">${esc(r.venue_name || '—')}</td>
          <td>${esc(r.brand_name || '—')}</td>
          <td>${esc(r.activity_type || '—')}</td>
          <td class="num">${r.earned === null ? '<span class="muted">—</span>' : money(r.earned)}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }

    function renderStats({ data, error }, venues) {
      const el = document.getElementById('stats');
      if (error) return render(el, { error });
      if (!data?.length) {
        return render(el, { empty: {
          title: 'Nothing here yet',
          body: 'Once activity is logged it will appear here.' } });
      }

      const totals = data.reduce((a, r) => ({
        activities: a.activities + Number(r.activity_count || 0),
        units: a.units + Number(r.units_moved || 0),
        photos: a.photos + Number(r.photo_count || 0),
      }), { activities: 0, units: 0, photos: 0 });

      // data is ordered newest first, so the range runs from the LAST row to
      // the first. Reading data[0] for both ends was part of the old bug.
      const latest = data[0];
      const earliest = data[data.length - 1];
      document.getElementById('range').textContent =
        `${fmtMonth(earliest.month)} — ${fmtMonth(latest.month)}`;

      // Venues must be counted DISTINCTLY. v_brand_venue_counts has one row per
      // brand/venue pair, so for staff its length counts a venue once per brand
      // that has touched it — 596 pairs across far fewer real venues.
      const venueCount = new Set((venues.data || []).map(v => v.venue_id)).size;

      el.className = 'stat-grid';
      el.innerHTML = `
        <div class="stat-card">
          <span class="num">${fmtNum(latest.activity_count)}</span>
          <span class="lbl">Activities</span>
          <div class="meta">in ${esc(fmtMonth(latest.month))}${
            Number(latest.brands_active) > 1
              ? ` across ${fmtNum(latest.brands_active)} brands` : ''}</div>
        </div>
        <div class="stat-card">
          <span class="num">${fmtNum(venueCount)}</span>
          <span class="lbl">Venues</span>
          <div class="meta">all time</div>
        </div>
        <div class="stat-card">
          <span class="num">${fmtNum(totals.activities)}</span>
          <span class="lbl">Total activities</span>
          <div class="meta">across ${data.length} month${data.length === 1 ? '' : 's'}</div>
        </div>
        <div class="stat-card">
          <span class="num">${fmtNum(totals.units)}</span>
          <span class="lbl">Units moved</span>
          <div class="meta">${fmtNum(totals.photos)} photo${totals.photos === 1 ? '' : 's'} captured</div>
        </div>`;
    }

    function renderMonths({ data, error }) {
      const el = document.getElementById('months');
      if (error) return render(el, { error });
      if (!data?.length) return render(el, { empty: { title: 'No months yet', body: '' } });

      // Only worth a Brands column when more than one brand is visible — a
      // brand user would otherwise get a column of 1s.
      const multiBrand = data.some(r => Number(r.brands_active) > 1);

      const columns = [
        { head: 'Month', always: true, nowrap: true, cls: 'venue',
          sortValue: r => r.month, get: r => esc(fmtMonth(r.month)) },
        ...(multiBrand ? [{ head: 'Brands', cls: 'num',
          value: r => Number(r.brands_active), get: r => fmtNum(r.brands_active) }] : []),
        { head: 'Activities', cls: 'num', always: true,
          value: r => Number(r.activity_count), get: r => fmtNum(r.activity_count) },
        { head: 'Venues', cls: 'num',
          value: r => Number(r.venues_touched), get: r => fmtNum(r.venues_touched) },
        { head: 'Units', cls: 'num',
          value: r => Number(r.units_moved), get: r => fmtNum(r.units_moved) },
        { head: 'Photos', cls: 'num', value: r => Number(r.photo_count),
          get: r => `<span class="${Number(r.photo_count) ? '' : 'muted'}">${fmtNum(r.photo_count)}</span>` },
      ];

      sortableTable(el, data, columns, {
        sort: 'Month',
        dir: 'desc',
        // Drill down: the month carries through as a query parameter, which the
        // activity page reads. No build step, no router.
        onRowClick: r => { location.href = `activity.html?month=${String(r.month).slice(0, 7)}`; },
      });
    }

    function renderRecent({ data, error }) {
      const el = document.getElementById('recent');
      if (error) return render(el, { error });
      if (!data?.length) return render(el, { empty: { title: 'No activity yet', body: '' } });

      const multiBrand = new Set(data.map(r => r.brand_name)).size > 1;
      el.innerHTML = `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Date</th>${multiBrand ? '<th>Brand</th>' : ''}<th>Venue</th>
          <th>What</th><th class="num">Qty</th></tr></thead>
        <tbody>${data.map(r => `<tr>
          <td class="nowrap">${esc(fmtDate(r.activity_date))}</td>
          ${multiBrand ? `<td>${esc(r.brand_name || '—')}</td>` : ''}
          <td class="venue">${esc(r.venue_name || '—')}</td>
          <td>${esc(r.title || r.activity_type)}</td>
          <td class="num ${r.quantity ? '' : 'muted'}">${r.quantity ? fmtNum(r.quantity) : '—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }
  </script>
</body>
</html>
