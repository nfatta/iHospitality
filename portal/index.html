<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | iHospitality Brand Portal</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <nav id="shell-nav"></nav>
  <div class="mobile-nav" id="shell-mobile"></div>

  <main class="portal-main">
    <div class="portal-head">
      <div>
        <span class="portal-eyebrow">Brand Portal</span>
        <h1 id="title">Dashboard</h1>
        <p class="portal-sub" id="range"></p>
      </div>
    </div>

    <div id="stats"></div>

    <div class="panel">
      <div class="panel-head">
        <h2>Month by month</h2>
        <span class="hint">Activity across your accounts</span>
      </div>
      <div id="months"></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Recent activity</h2>
        <span class="hint"><a href="activity.html" style="color:var(--gold);text-decoration:none">View all &rarr;</a></span>
      </div>
      <div id="recent"></div>
    </div>
  </main>

  <footer id="shell-footer"></footer>

  <script type="module">
    import { db, requireAuth, renderShell, render, esc, fmtDate, fmtMonth, fmtNum,
             sortableTable } from './portal.js';

    const auth = await requireAuth();
    if (auth) {
      renderShell('index.html', auth.profile);
      document.getElementById('title').textContent = auth.profile.brands?.name || 'All brands';

      // Every query below is unfiltered by brand ON PURPOSE. Row-level security
      // adds the brand restriction in Postgres, so the browser never decides
      // what this user may see — and a bug here cannot leak another brand.
      //
      // v_monthly_summary is grouped by MONTH ONLY. Because the view runs as
      // security_invoker, RLS filters the rows before the aggregate: a brand
      // user gets their own months, staff get all brands combined into one row
      // per month. That is the fix for August appearing four times.
      const [months, log, venues] = await Promise.all([
        db.from('v_monthly_summary').select('*').order('month', { ascending: false }),
        db.from('v_brand_activity_log').select('*')
          // See the note in activity.html. Filtered BEFORE the limit.
          .neq('activity_type_code', 'monthly_commission').limit(10),
        db.from('v_brand_venue_counts').select('venue_id'),
      ]);

      renderStats(months, venues);
      renderMonths(months);
      renderRecent(log);
    }

    function renderStats({ data, error }, venues) {
      const el = document.getElementById('stats');
      if (error) return render(el, { error });
      if (!data?.length) {
        return render(el, { empty: {
          title: 'Nothing here yet',
          body: 'Once activity is logged it will appear here.' } });
      }

      const totals = data.reduce((a, r) => ({
        activities: a.activities + Number(r.activity_count || 0),
        units: a.units + Number(r.units_moved || 0),
        photos: a.photos + Number(r.photo_count || 0),
      }), { activities: 0, units: 0, photos: 0 });

      // data is ordered newest first, so the range runs from the LAST row to
      // the first. Reading data[0] for both ends was part of the old bug.
      const latest = data[0];
      const earliest = data[data.length - 1];
      document.getElementById('range').textContent =
        `${fmtMonth(earliest.month)} — ${fmtMonth(latest.month)}`;

      // Venues must be counted DISTINCTLY. v_brand_venue_counts has one row per
      // brand/venue pair, so for staff its length counts a venue once per brand
      // that has touched it — 596 pairs across far fewer real venues.
      const venueCount = new Set((venues.data || []).map(v => v.venue_id)).size;

      el.className = 'stat-grid';
      el.innerHTML = `
        <div class="stat-card">
          <span class="num">${fmtNum(latest.activity_count)}</span>
          <span class="lbl">Activities</span>
          <div class="meta">in ${esc(fmtMonth(latest.month))}${
            Number(latest.brands_active) > 1
              ? ` across ${fmtNum(latest.brands_active)} brands` : ''}</div>
        </div>
        <div class="stat-card">
          <span class="num">${fmtNum(venueCount)}</span>
          <span class="lbl">Venues</span>
          <div class="meta">all time</div>
        </div>
        <div class="stat-card">
          <span class="num">${fmtNum(totals.activities)}</span>
          <span class="lbl">Total activities</span>
          <div class="meta">across ${data.length} month${data.length === 1 ? '' : 's'}</div>
        </div>
        <div class="stat-card">
          <span class="num">${fmtNum(totals.units)}</span>
          <span class="lbl">Units moved</span>
          <div class="meta">${fmtNum(totals.photos)} photo${totals.photos === 1 ? '' : 's'} captured</div>
        </div>`;
    }

    function renderMonths({ data, error }) {
      const el = document.getElementById('months');
      if (error) return render(el, { error });
      if (!data?.length) return render(el, { empty: { title: 'No months yet', body: '' } });

      // Only worth a Brands column when more than one brand is visible — a
      // brand user would otherwise get a column of 1s.
      const multiBrand = data.some(r => Number(r.brands_active) > 1);

      const columns = [
        { head: 'Month', always: true, nowrap: true, cls: 'venue',
          sortValue: r => r.month, get: r => esc(fmtMonth(r.month)) },
        ...(multiBrand ? [{ head: 'Brands', cls: 'num',
          value: r => Number(r.brands_active), get: r => fmtNum(r.brands_active) }] : []),
        { head: 'Activities', cls: 'num', always: true,
          value: r => Number(r.activity_count), get: r => fmtNum(r.activity_count) },
        { head: 'Venues', cls: 'num',
          value: r => Number(r.venues_touched), get: r => fmtNum(r.venues_touched) },
        { head: 'Units', cls: 'num',
          value: r => Number(r.units_moved), get: r => fmtNum(r.units_moved) },
        { head: 'Photos', cls: 'num', value: r => Number(r.photo_count),
          get: r => `<span class="${Number(r.photo_count) ? '' : 'muted'}">${fmtNum(r.photo_count)}</span>` },
      ];

      sortableTable(el, data, columns, {
        sort: 'Month',
        dir: 'desc',
        // Drill down: the month carries through as a query parameter, which the
        // activity page reads. No build step, no router.
        onRowClick: r => { location.href = `activity.html?month=${String(r.month).slice(0, 7)}`; },
      });
    }

    function renderRecent({ data, error }) {
      const el = document.getElementById('recent');
      if (error) return render(el, { error });
      if (!data?.length) return render(el, { empty: { title: 'No activity yet', body: '' } });

      const multiBrand = new Set(data.map(r => r.brand_name)).size > 1;
      el.innerHTML = `<div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Date</th>${multiBrand ? '<th>Brand</th>' : ''}<th>Venue</th>
          <th>What</th><th class="num">Qty</th></tr></thead>
        <tbody>${data.map(r => `<tr>
          <td class="nowrap">${esc(fmtDate(r.activity_date))}</td>
          ${multiBrand ? `<td>${esc(r.brand_name || '—')}</td>` : ''}
          <td class="venue">${esc(r.venue_name || '—')}</td>
          <td>${esc(r.title || r.activity_type)}</td>
          <td class="num ${r.quantity ? '' : 'muted'}">${r.quantity ? fmtNum(r.quantity) : '—'}</td>
        </tr>`).join('')}</tbody></table></div>`;
    }
  </script>
</body>
</html>
