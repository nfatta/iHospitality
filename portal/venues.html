<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Venues | iHospitality Brand Portal</title>
  <link rel="icon" href="../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="portal.css">
</head>
<body>

  <nav id="shell-nav"></nav>
  <div class="mobile-nav" id="shell-mobile"></div>

  <main class="portal-main">
    <div class="portal-head">
      <div>
        <span class="portal-eyebrow">Brand Portal</span>
        <h1>Venues</h1>
        <p class="portal-sub" id="count"></p>
      </div>
      <div class="filters">
        <input type="search" id="f-search" placeholder="Search venues…" style="min-width:200px">
        <select id="f-status"><option value="">All statuses</option></select>
        <select id="f-market"><option value="">All markets</option></select>
      </div>
    </div>

    <div id="stats"></div>

    <div class="panel">
      <div class="panel-head">
        <h2>Your accounts</h2>
        <span class="hint" id="shown"></span>
      </div>
      <div id="list"></div>
    </div>
  </main>

  <footer id="shell-footer"></footer>

  <script type="module">
    import { db, requireAuth, renderShell, render, esc, fmtDate, fmtNum, MARKET_LABEL, table, fillSelect } from './portal.js';

    const STATUS_ORDER = ['reordering', 'placed', 'pitched', 'prospect', 'dormant', 'lost'];

    const auth = await requireAuth();
    if (auth) {
      renderShell('venues.html', auth.profile);

      const { data, error } = await db.from('v_brand_venue_counts').select('*');
      if (error) {
        render(document.getElementById('list'), { error });
      } else if (!data.length) {
        render(document.getElementById('list'), { empty: {
          title: 'No venues yet',
          body: 'Venues we place your brand into will appear here.' } });
      } else {
        buildFilters(data);
        renderStats(data);
        ['f-search', 'f-status', 'f-market'].forEach(id =>
          document.getElementById(id).addEventListener('input', () => draw(data)));
        document.getElementById('count').textContent = `${fmtNum(data.length)} venues on record`;
        draw(data);
      }
    }

    function buildFilters(rows) {
      const statuses = [...new Set(rows.map(r => r.status))]
        .sort((a, b) => STATUS_ORDER.indexOf(a) - STATUS_ORDER.indexOf(b));
      const markets = [...new Set(rows.map(r => r.market).filter(Boolean))].sort();
      fillSelect('f-status', statuses.map(s => [s, s[0].toUpperCase() + s.slice(1)]));
      fillSelect('f-market', markets.map(m => [m, MARKET_LABEL[m] || m]));
    }

    function renderStats(rows) {
      const counts = {};
      for (const r of rows) counts[r.status] = (counts[r.status] || 0) + 1;
      // "Placed" is the number that matters commercially — it is the count of
      // accounts actually stocking the brand.
      const placed = (counts.placed || 0) + (counts.reordering || 0);
      const stale = rows.filter(r => Number(r.days_since_activity) > 90).length;

      const el = document.getElementById('stats');
      el.className = 'stat-grid';
      el.innerHTML = `
        <div class="stat-card"><span class="num">${fmtNum(rows.length)}</span>
          <span class="lbl">Total accounts</span></div>
        <div class="stat-card"><span class="num">${fmtNum(placed)}</span>
          <span class="lbl">Stocking your brand</span>
          <div class="meta">placed or reordering</div></div>
        <div class="stat-card"><span class="num">${fmtNum(counts.pitched || 0)}</span>
          <span class="lbl">Pitched</span>
          <div class="meta">visited, not yet placed</div></div>
        <div class="stat-card"><span class="num">${fmtNum(stale)}</span>
          <span class="lbl">Quiet 90+ days</span>
          <div class="meta">worth a revisit</div></div>`;
    }

    function draw(rows) {
      const q = document.getElementById('f-search').value.trim().toLowerCase();
      const status = document.getElementById('f-status').value;
      const market = document.getElementById('f-market').value;

      const filtered = rows.filter(r =>
        (!status || r.status === status) &&
        (!market || r.market === market) &&
        (!q || (r.venue_name || '').toLowerCase().includes(q) ||
               (r.city || '').toLowerCase().includes(q)))
        .sort((a, b) => (b.most_recent_activity || '').localeCompare(a.most_recent_activity || ''));

      document.getElementById('shown').textContent =
        filtered.length === rows.length
          ? `${fmtNum(rows.length)} shown`
          : `${fmtNum(filtered.length)} of ${fmtNum(rows.length)} shown`;

      const el = document.getElementById('list');
      if (!filtered.length) {
        return render(el, { empty: {
          title: 'No venues match',
          body: 'Try a different search or clear the filters.' } });
      }

      // City and market are empty until the admin fills them in — HubSpot's
      // exports do not carry either — so those columns stay hidden until they
      // have something to show. See table() in portal.js.
      el.innerHTML = table(filtered, [
        { head: 'Venue',      always: true, cls: 'venue', get: r => esc(r.venue_name) },
        { head: 'City',       value: r => r.city, get: r => esc(r.city || '') },
        { head: 'Market',     value: r => r.market,
          get: r => r.market ? esc(MARKET_LABEL[r.market] || r.market) : '' },
        { head: 'Status',     always: true,
          get: r => `<span class="pill pill-${esc(r.status)}">${esc(r.status)}</span>` },
        { head: 'Activities', always: true, cls: 'num', get: r => fmtNum(r.activity_count) },
        { head: 'Last visit', always: true, nowrap: true, get: r => {
            const days = Number(r.days_since_activity);
            const stale = Number.isFinite(days) && days > 90;
            return esc(fmtDate(r.most_recent_activity)) +
              (stale ? `<div class="muted" style="font-size:0.72rem">${fmtNum(days)} days ago</div>` : '');
          } },
        { head: 'First placed', nowrap: true, value: r => r.first_placed_on,
          get: r => r.first_placed_on ? esc(fmtDate(r.first_placed_on)) : '<span class="muted">—</span>' },
      ]);
    }
  </script>
</body>
</html>
